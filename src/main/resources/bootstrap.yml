app:
  port: ${APP_PORT:8080}
  logging: debug
  consul:
    host: consul-service
    port: 8500

server:
  port: ${app.port}

spring:
  application:
    name: tesoreria-report-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 200000
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        # Solo resolver instancias con los checks en passing (Feign/LoadBalancer).
        query-passing: true
        # Consul: readiness (sin dependencias) + poda si queda critico.
        health-check-path: /actuator/health/readiness
        health-check-critical-timeout: 5m
        tags: tesoreria,report
logging:
  level:
    um.tesoreria.report: ${app.logging}
    web: ${app.logging}
    org:
      springframework:
        web: ${app.logging}
        cloud: ${app.logging}
        security: ${app.logging}
    feign: ${app.logging}
    feign.hystrix: ${app.logging}
management:
  health:
